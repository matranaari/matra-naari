<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <link rel="icon" type="image/png" href="../favicon.png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Kalam:wght@300;400;700&family=Karla:wght@400;500;600&display=swap"/>
  <link rel="stylesheet" href="../assets/styles.css"/>
  <title>Shop Kurtis — Naari</title>
  <meta name="description" content="Straight, A-line, anarkali, angrakha, kaftan, short kurtis and sets."/>
  <meta property="og:type" content="website"/>
  <meta property="og:title" content="Shop Kurtis — Naari"/>
  <meta property="og:description" content="Straight, A-line, anarkali, angrakha, kaftan, short kurtis and sets."/>
  <style>
    body {
      background-image: url('../images/paper.jpg'), url('/images/paper.jpg');
      background-size: 700px;
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header class="sticky top-0 z-30 border-b border-border/60 bg-background/85 backdrop-blur">
    <div class="mx-auto flex max-w-6xl items-center justify-between px-5 py-2">
      <a aria-label="Naari home" href="../">
        <img src="../images/naari-logo.png" alt="Naari" class="h-11 w-auto sm:h-14 mix-blend-multiply"/>
      </a>
      <nav class="flex gap-5 font-hand text-lg sm:gap-8">
        <a class="hidden text-foreground/80 hover:text-primary sm:inline" href="../">Home</a>
        <a class="hidden text-foreground/80 hover:text-primary sm:inline !inline text-primary" href="./" data-status="active" aria-current="page">Shop</a>
        <a class="hidden text-foreground/80 hover:text-primary sm:inline" href="../story/">Our Story</a>
        <a class="hidden text-foreground/80 hover:text-primary sm:inline" href="../contact/">Contact</a>
        <a class="text-primary" href="../cart/">Bag (<span class="bag-count-badge">0</span>)</a>
      </nav>
    </div>
  </header>

  <!-- Main Shop Content -->
  <main>
    <section class="mx-auto max-w-6xl px-3 py-10 sm:px-5 sm:py-14">
      <div class="text-center">
        <p class="font-hand text-lg text-primary">the collection</p>
        <h1 class="text-4xl font-semibold sm:text-5xl">Shop Kurtis</h1>
      </div>

      <!-- AI Stylist Area -->
      <section class="mx-auto mt-6 max-w-3xl bg-card/70 p-4 ring-1 ring-border sm:p-6" id="ai-stylist-box">
        <p class="font-hand text-lg text-primary">✿ AI stylist</p>
        <h2 class="text-2xl font-semibold sm:text-3xl">Tell us the occasion, we'll pick your kurti</h2>
        <form id="ai-stylist-form" class="mt-4 flex flex-col gap-2 sm:flex-row">
          <input
            id="ai-prompt-input"
            type="text"
            maxlength="500"
            placeholder="e.g. A day wedding, I like flowy fits and soft colours"
            class="min-w-0 flex-1 border border-border bg-background px-3 py-2.5 font-hand text-lg outline-none focus:border-primary"
          />
          <button
            id="ai-submit-btn"
            type="submit"
            disabled
            class="bg-primary px-6 py-2.5 text-xs uppercase tracking-[0.2em] text-primary-foreground disabled:opacity-60 transition hover:opacity-90 cursor-pointer"
          >
            Find my kurti
          </button>
        </form>

        <div class="mt-3 flex flex-wrap gap-2">
          <button type="button" class="ai-chip border border-dashed border-primary/50 px-2 py-1 font-hand text-sm text-primary hover:bg-primary/5 transition cursor-pointer" data-prompt="Office wear, breathable cotton">
            Office wear, breathable cotton
          </button>
          <button type="button" class="ai-chip border border-dashed border-primary/50 px-2 py-1 font-hand text-sm text-primary hover:bg-primary/5 transition cursor-pointer" data-prompt="Haldi ceremony, something bright">
            Haldi ceremony, something bright
          </button>
          <button type="button" class="ai-chip border border-dashed border-primary/50 px-2 py-1 font-hand text-sm text-primary hover:bg-primary/5 transition cursor-pointer" data-prompt="Loose and comfy for travel">
            Loose and comfy for travel
          </button>
        </div>

        <div id="ai-results-container" class="mt-5 hidden"></div>
      </section>

      <!-- Category Filter Tabs -->
      <div class="mt-8 flex flex-wrap justify-center gap-2" id="category-tabs"></div>

      <!-- Products Grid -->
      <div class="mt-8 grid grid-cols-2 gap-3 sm:mt-10 sm:gap-6 lg:grid-cols-3" id="products-grid"></div>
    </section>
  </main>

  <!-- Footer -->
  <footer class="mt-24 border-t border-border/60">
    <div class="mx-auto grid max-w-6xl gap-8 px-5 py-12 sm:grid-cols-3">
      <div>
        <img src="../images/naari-logo.png" alt="Naari" class="h-16 w-auto mix-blend-multiply"/>
        <p class="mt-2 font-hand text-muted-foreground">Modern kurtis, woven with heritage.</p>
      </div>
      <div class="font-hand text-lg">
        <a class="block hover:text-primary" href="../">Home</a>
        <a class="block hover:text-primary active text-primary" href="./" data-status="active" aria-current="page">Shop</a>
        <a class="block hover:text-primary" href="../story/">Our Story</a>
        <a class="block hover:text-primary" href="../contact/">Contact</a>
      </div>
      <div class="text-sm text-muted-foreground">
        <p>hello@naari.in</p>
        <p><a href="https://wa.me/918849366915?text=Hi%20Naari!%20I'd%20like%20to%20enquire%20about%20your%20kurtis." target="_blank" class="hover:text-primary transition">+91 88493 66915</a></p>
        <p class="mt-4">© 2026 Naari</p>
      </div>
    </div>
  </footer>

  <script src="../assets/app.js"></script>
  <script>
    let activeCategory = 'All';
    const productCardStates = {};

    function initProductState(product) {
      if (!productCardStates[product.id]) {
        productCardStates[product.id] = {
          color: product.colors[0]?.name || '',
          size: product.sizes.length === 1 ? product.sizes[0] : '',
          qty: 1
        };
      }
    }

    function renderCategoryTabs() {
      const container = document.getElementById('category-tabs');
      const tabs = ['All', ...CATEGORIES];
      container.innerHTML = tabs.map(cat => {
        const isActive = cat === activeCategory;
        return `
          <button
            type="button"
            class="category-tab-btn px-3 py-1 font-hand text-base sm:px-4 sm:py-1.5 sm:text-lg transition cursor-pointer ${
              isActive
                ? 'bg-primary text-primary-foreground'
                : 'border border-border hover:border-primary text-foreground'
            }"
            data-category="${cat}"
          >
            ${cat}
          </button>
        `;
      }).join('');

      container.querySelectorAll('.category-tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          activeCategory = btn.dataset.category;
          renderCategoryTabs();
          renderProducts();
        });
      });
    }

    function renderProductCard(p) {
      initProductState(p);
      const state = productCardStates[p.id];
      const isSoldOut = p.inStock === false;
      const imgPath = '../' + p.relativeImage;

      const colorsHtml = `
        <div>
          <p class="mb-1 truncate text-[10px] uppercase tracking-widest text-muted-foreground sm:mb-1.5 sm:text-xs">
            ${p.colors.length} colours · <span class="text-foreground" id="color-label-${p.id}">${state.color}</span>
          </p>
          <div class="flex flex-wrap gap-1.5 sm:gap-2">
            ${p.colors.map(c => `
              <button
                type="button"
                aria-label="${c.name}"
                title="${c.name}"
                style="background-color: ${c.swatch};"
                data-product-id="${p.id}"
                data-color-name="${c.name}"
                class="color-btn h-6 w-6 rounded-full ring-1 ring-border transition cursor-pointer sm:h-7 sm:w-7 ${
                  state.color === c.name ? 'ring-2 ring-primary ring-offset-2 ring-offset-card' : ''
                }"
              ></button>
            `).join('')}
          </div>
        </div>
      `;

      const sizesHtml = `
        <div>
          <p class="mb-1 text-[10px] uppercase tracking-widest text-muted-foreground sm:mb-1.5 sm:text-xs">
            ${p.sizes.length} ${p.sizes.length === 1 ? 'size' : 'sizes'}
          </p>
          <div class="flex flex-wrap gap-1 sm:gap-1.5">
            ${p.sizes.map(s => {
              const available = !isSoldOut && isSizeAvailable(p, s);
              const isSelected = state.size === s;
              if (available) {
                return `
                  <button
                    type="button"
                    data-product-id="${p.id}"
                    data-size="${s}"
                    class="size-btn min-w-8 border px-1.5 py-0.5 text-xs transition cursor-pointer sm:min-w-10 sm:px-2 sm:py-1 sm:text-sm ${
                      isSelected
                        ? 'border-primary bg-primary text-primary-foreground'
                        : 'border-border hover:border-primary text-foreground'
                    }"
                  >
                    ${s}
                  </button>
                `;
              } else {
                return `
                  <button
                    type="button"
                    disabled
                    title="${s} is sold out"
                    class="min-w-8 border px-1.5 py-0.5 text-xs transition sm:min-w-10 sm:px-2 sm:py-1 sm:text-sm cursor-not-allowed border-border text-muted-foreground line-through opacity-60"
                  >
                    ${s}
                  </button>
                `;
              }
            }).join('')}
          </div>
        </div>
      `;

      return `
        <div id="${p.id}" class="scroll-mt-24">
          <article class="group flex min-w-0 flex-col bg-card/70 p-2 shadow-sm ring-1 ring-border sm:p-3 h-full">
            <div class="relative overflow-hidden">
              <img
                src="${imgPath}"
                alt="${p.name}"
                loading="lazy"
                width="768"
                height="1024"
                class="aspect-[3/4] w-full object-cover transition-transform duration-700 group-hover:scale-105 ${
                  isSoldOut ? 'opacity-60 grayscale' : ''
                }"
              />
              ${isSoldOut ? `<span class="absolute left-2 top-2 bg-foreground px-2 py-0.5 text-[10px] uppercase tracking-widest text-background sm:text-xs">Sold out</span>` : ''}
            </div>

            <div class="flex min-w-0 flex-1 flex-col gap-2 px-0.5 pt-3 sm:gap-3 sm:px-1 sm:pt-4">
              <div class="flex flex-col gap-0.5 sm:flex-row sm:items-baseline sm:justify-between sm:gap-2">
                <h3 class="text-lg font-semibold leading-tight sm:text-2xl">${p.name}</h3>
                <span class="font-display text-base text-primary sm:text-xl">${formatPrice(p.price)}</span>
              </div>
              <p class="hidden font-hand text-muted-foreground sm:block">${p.note}</p>

              ${colorsHtml}
              ${sizesHtml}

              <!-- Quantity Selector -->
              <div class="flex items-center gap-2">
                <span class="text-[10px] uppercase tracking-widest text-muted-foreground sm:text-xs">Qty</span>
                <div class="flex items-center border border-border">
                  <button
                    type="button"
                    aria-label="Decrease quantity"
                    data-product-id="${p.id}"
                    data-action="dec"
                    class="qty-btn h-7 w-7 hover:text-primary cursor-pointer flex items-center justify-center font-medium"
                  >−</button>
                  <span id="qty-val-${p.id}" class="w-6 text-center text-sm tabular-nums">${state.qty}</span>
                  <button
                    type="button"
                    aria-label="Increase quantity"
                    data-product-id="${p.id}"
                    data-action="inc"
                    class="qty-btn h-7 w-7 hover:text-primary cursor-pointer flex items-center justify-center font-medium"
                  >+</button>
                </div>
              </div>

              <!-- Action Buttons -->
              <div class="mt-auto grid gap-1.5 pt-1 sm:grid-cols-2 sm:gap-2">
                <button
                  type="button"
                  data-product-id="${p.id}"
                  class="add-to-bag-btn border border-primary py-2 text-[11px] uppercase tracking-[0.15em] text-primary transition hover:bg-primary/5 sm:py-3 sm:text-xs cursor-pointer font-medium"
                >
                  Add to bag
                </button>
                <button
                  type="button"
                  data-product-id="${p.id}"
                  class="order-now-btn py-2 text-[11px] uppercase tracking-[0.15em] transition sm:py-3 sm:text-xs cursor-pointer font-medium ${
                    isSoldOut
                      ? 'bg-muted text-muted-foreground cursor-not-allowed'
                      : 'bg-primary text-primary-foreground hover:opacity-90'
                  }"
                >
                  ${isSoldOut ? 'Sold out' : 'Order now'}
                </button>
              </div>
            </div>
          </article>
        </div>
      `;
    }

    function renderProducts() {
      const container = document.getElementById('products-grid');
      const filtered = activeCategory === 'All'
        ? PRODUCTS
        : PRODUCTS.filter(p => p.category === activeCategory);

      container.innerHTML = filtered.map(renderProductCard).join('');
      attachProductCardListeners();
    }

    function attachProductCardListeners() {
      document.querySelectorAll('.color-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const pid = btn.dataset.productId;
          const colorName = btn.dataset.colorName;
          productCardStates[pid].color = colorName;
          const label = document.getElementById(`color-label-${pid}`);
          if (label) label.textContent = colorName;

          const card = document.getElementById(pid);
          card.querySelectorAll('.color-btn').forEach(b => {
            if (b.dataset.colorName === colorName) {
              b.classList.add('ring-2', 'ring-primary', 'ring-offset-2', 'ring-offset-card');
            } else {
              b.classList.remove('ring-2', 'ring-primary', 'ring-offset-2', 'ring-offset-card');
            }
          });
        });
      });

      document.querySelectorAll('.size-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const pid = btn.dataset.productId;
          const size = btn.dataset.size;
          productCardStates[pid].size = size;

          const card = document.getElementById(pid);
          card.querySelectorAll('.size-btn').forEach(b => {
            if (b.dataset.size === size) {
              b.classList.add('border-primary', 'bg-primary', 'text-primary-foreground');
              b.classList.remove('border-border', 'hover:border-primary', 'text-foreground');
            } else {
              b.classList.remove('border-primary', 'bg-primary', 'text-primary-foreground');
              b.classList.add('border-border', 'hover:border-primary', 'text-foreground');
            }
          });
        });
      });

      document.querySelectorAll('.qty-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const pid = btn.dataset.productId;
          const action = btn.dataset.action;
          const state = productCardStates[pid];
          if (action === 'dec') {
            state.qty = Math.max(1, state.qty - 1);
          } else {
            state.qty = Math.min(10, state.qty + 1);
          }
          const valEl = document.getElementById(`qty-val-${pid}`);
          if (valEl) valEl.textContent = state.qty;
        });
      });

      document.querySelectorAll('.add-to-bag-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const pid = btn.dataset.productId;
          handleAddToCart(pid, false);
        });
      });

      document.querySelectorAll('.order-now-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const pid = btn.dataset.productId;
          handleAddToCart(pid, true);
        });
      });
    }

    function handleAddToCart(productId, shouldRedirectToCart) {
      const p = PRODUCTS.find(item => item.id === productId);
      if (!p) return;
      const state = productCardStates[productId];
      const toast = getToast();

      if (p.inStock === false) {
        toast.error(`${p.name} is sold out right now.`);
        return;
      }
      if (!state.size) {
        toast.error('Please choose a size first.');
        return;
      }
      if (!isSizeAvailable(p, state.size)) {
        toast.error(`Size ${state.size} is sold out.`);
        return;
      }

      try {
        addToCart({
          id: p.id,
          name: p.name,
          image: p.relativeImage,
          price: p.price,
          color: state.color,
          size: state.size,
          qty: state.qty
        });

        if (shouldRedirectToCart) {
          window.location.href = '../cart/';
        } else {
          toast.success(`Added ${p.name} (${state.color}, ${state.size}) × ${state.qty}`);
        }
      } catch (err) {
        toast.error("Couldn't add this to your bag. Please try again.");
      }
    }

    function setupAIStylist() {
      const input = document.getElementById('ai-prompt-input');
      const submitBtn = document.getElementById('ai-submit-btn');
      const form = document.getElementById('ai-stylist-form');
      const resultsContainer = document.getElementById('ai-results-container');
      const chips = document.querySelectorAll('.ai-chip');

      function validateInput() {
        const val = input.value.trim();
        submitBtn.disabled = val.length < 3;
      }

      input.addEventListener('input', validateInput);

      function runAIStylist(promptText) {
        input.value = promptText;
        submitBtn.disabled = true;
        submitBtn.textContent = 'Styling…';

        setTimeout(() => {
          const res = queryAIStylist(promptText);
          resultsContainer.classList.remove('hidden');

          const picksHtml = res.picks.map(pick => {
            const prod = PRODUCTS.find(p => p.id === pick.id);
            if (!prod) return '';
            return `
              <li>
                <a href="#${prod.id}" class="grid grid-cols-[56px_minmax(0,1fr)] gap-3 hover:opacity-90 transition p-2 bg-background/50 ring-1 ring-border">
                  <img src="../${prod.relativeImage}" alt="${prod.name}" class="aspect-[3/4] w-full object-cover" />
                  <div class="min-w-0">
                    <p class="font-display text-lg font-semibold">
                      ${prod.name} <span class="text-primary font-normal">· ${formatPrice(prod.price)}</span>
                    </p>
                    <p class="text-sm text-muted-foreground">${pick.reason}</p>
                  </div>
                </a>
              </li>
            `;
          }).join('');

          resultsContainer.innerHTML = `
            <div class="mt-5">
              <p class="font-hand text-lg">${res.summary}</p>
              <ul class="mt-3 space-y-3">${picksHtml}</ul>
            </div>
          `;

          submitBtn.disabled = false;
          submitBtn.textContent = 'Find my kurti';
        }, 350);
      }

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const val = input.value.trim();
        if (val.length >= 3) {
          runAIStylist(val);
        }
      });

      chips.forEach(chip => {
        chip.addEventListener('click', () => {
          runAIStylist(chip.dataset.prompt);
        });
      });
    }

    function handleInitialHash() {
      const hash = window.location.hash.slice(1);
      if (hash) {
        setTimeout(() => {
          const target = document.getElementById(hash);
          if (target) {
            target.scrollIntoView({ behavior: 'smooth' });
          }
        }, 150);
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderCategoryTabs();
      renderProducts();
      setupAIStylist();
      handleInitialHash();
    });
  </script>
</body>
</html>
